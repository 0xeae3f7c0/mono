name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["kind/bug", "status/needs-triage", "source/human"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ... 2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, operating system, and relevant workflow run.
    validations:
      required: false
