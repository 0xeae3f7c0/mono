name: Activity Report

# Every 4 hours: commits per author over the last 4 hours, written to the job summary.

on:
  schedule:
    - cron: "55 */4 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Time window (Go duration, e.g. 24h, 168h)
        default: 4h

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - name: Summarize activity
        working-directory: go
        env:
          SINCE: ${{ inputs.since || '4h' }}
        run: |
          {
            echo '```'
            go run ./cmd/activity --repo .. --since "$SINCE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
