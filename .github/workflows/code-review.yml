name: Automated Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
      issues: write
    name: Automated review checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all --all-features
      - name: Run repository review
        run: cargo run -- review origin/${{ github.event.pull_request.base.ref }}

  report:
    name: Publish review summary
    runs-on: ubuntu-latest
    needs: review
    if: always()
    # Commenting on a pull request needs pull-requests: write, not just issues.
    # Dependabot runs cannot read OWNER_TOKEN, so they rely on this token.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # OWNER_TOKEN posts the review as the repository owner; falls back to the bot.
          github-token: ${{ secrets.OWNER_TOKEN || github.token }}
          script: |
            const result = '${{ needs.review.result }}';
            const icon = result === 'success' ? '✅' : '❌';
            const body = [
              '## Automated review summary',
              '',
              `${icon} **Automated checks: ${result}**`,
              '',
              'Checks include Rust formatting, Clippy, tests, and repository structure/diff validation.',
              '',
              'This is an automated report, not a human review or approval. Inspect the changes before merging.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.body?.includes('## Automated review summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
