name: Coverage

# Test coverage for the root Rust workspace (cargo-llvm-cov) and every Go module,
# uploaded to Codecov with one flag per area. Codecov comments the coverage
# change on pull requests. Public repositories upload without a token; set the
# CODECOV_TOKEN secret to avoid rate limits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (crates/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  go:
    name: Go modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Test with coverage
        run: |
          mkdir -p coverage
          for mod in $(git ls-files -- '*go.mod'); do
            dir=$(dirname "$mod")
            name=$(echo "$dir" | tr '/' '-')
            (cd "$dir" && go test -coverprofile="$GITHUB_WORKSPACE/coverage/$name.out" ./...)
          done
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: coverage
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
