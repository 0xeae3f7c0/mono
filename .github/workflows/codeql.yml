name: CodeQL

# Code scanning for every language in the monorepo. Runs on pushes to main and
# weekly rather than on every pull request: dependency PRs arrive in batches.
#
# Rust is scanned per project: every directory with a Cargo.lock gets its own
# job (source-root set to that project, its own results category), so the Rust
# scan runs in parallel instead of one 45-minute job over all 22 workspaces.

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Never cancel a running scan: the Rust scan takes longer than the gap between
# pushes, so cancelling meant scans almost never finished. GitHub keeps at most
# one run waiting behind it.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-projects:
    name: list Rust projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          projects=$(git ls-files -- '*Cargo.lock' | xargs -n1 dirname | jq -R . | jq -sc .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  rust:
    name: analyze (rust, ${{ matrix.project }})
    needs: rust-projects
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.rust-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none
          source-root: ${{ matrix.project }}
          # The root workspace excludes pkgs/; each pkgs/ project has its own job.
          config: |
            paths-ignore:
              - pkgs
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:rust/${{ matrix.project == '.' && 'root' || matrix.project }}

  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
          # CodeQL cannot analyze Go without building it.
          - { language: go, build-mode: manual }
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build every Go module
        if: matrix.language == 'go'
        run: |
          for mod in $(git ls-files -- '*go.mod'); do
            echo "::group::$(dirname "$mod")"
            (cd "$(dirname "$mod")" && go build ./...)
            echo "::endgroup::"
          done
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
