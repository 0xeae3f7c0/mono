name: CodeQL

# Code scanning for every language in the monorepo. Runs on pushes to main and
# weekly rather than on every pull request: dependency PRs arrive in batches and
# a full scan of all 21 Rust crates takes a long time.

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: rust, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
          # CodeQL cannot analyze Go without building it.
          - { language: go, build-mode: manual }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build every Go module
        if: matrix.language == 'go'
        run: |
          for mod in $(git ls-files -- '*go.mod'); do
            echo "::group::$(dirname "$mod")"
            (cd "$(dirname "$mod")" && go build ./...)
            echo "::endgroup::"
          done
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
