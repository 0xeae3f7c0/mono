name: Auto Format

# Formats main after every push and regenerates the generated files that CI
# checks (project workflows, labeler config, portal catalog), committing the
# result only when tracked files change. Never commits deletions. Pushes with OWNER_TOKEN so CI runs on the commit
# (pushes made with GITHUB_TOKEN do not trigger workflows). The follow-up push
# produces no diff, so this does not loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-format
  cancel-in-progress: false

jobs:
  format:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.OWNER_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Apply formatting
        run: cargo fmt --all
      - name: Regenerate generated files
        run: |
          node scripts/gen-pkg-workflows.mjs
          node scripts/gen-catalog.mjs
          # Keep any file a generator removed; deletions stay a human decision.
          git ls-files --deleted -z | xargs -0 -r git checkout --
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          if [ -n "$GH_TOKEN" ]; then
            bash scripts/owner-identity.sh
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git commit -am "chore: apply formatting and regenerate files"
          git pull --rebase origin main
          git push origin HEAD:main
