name: Approve Ready Bot PRs

# Approves (as the repository owner via OWNER_TOKEN, marked automated) and
# squash-merges open pull requests from bot accounts once every check has passed
# and there are no conflicts, major updates included. Runs after each CI run and
# hourly. Without OWNER_TOKEN it falls back to GITHUB_TOKEN (github-actions[bot]),
# which needs "Allow GitHub Actions to create and approve pull requests" in
# Settings -> Actions -> General.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be approved and merged
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: approve-ready-prs
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/approve-ready-prs.sh
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN || secrets.GITHUB_TOKEN }}
          APPROVE_TOKEN: ${{ secrets.OWNER_TOKEN || github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
