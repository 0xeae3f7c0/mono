name: Repository Maintenance

# Every 4 hours, scans every Cargo, Go and npm project in the repository
# (root, go/, web/ and pkgs/*) and opens one PR per dependency with a
# newer release. Each PR auto-merges
# (rebase) once required checks pass. A single tracking issue stays open while
# runs fail.
#
# Requires OWNER_TOKEN (owner PAT with `repo` scope): PRs opened with the
# default GITHUB_TOKEN do not trigger CI, so required checks would never run.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

env:
  FAILURE_TITLE: "chore(deps): automated maintenance failing"

jobs:
  maintenance:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.OWNER_TOKEN }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Latest stable Go: the script updates every Go module, and pkgs/* require
      # newer Go than go/go.mod.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Nix for flake input updates (nix flake update <input>)
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Configure owner identity
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: bash scripts/owner-identity.sh
      - name: Open one PR per updated package
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: bash scripts/update-deps.sh

  track-failure:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    needs: maintenance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.maintenance.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.FAILURE_TITLE;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'source/maintenance', per_page: 100 });
            const issue = open.find(i => i.title === title && !i.pull_request);

            if (process.env.RESULT === 'failure') {
              const body = `Maintenance run failed: ${runUrl}`;
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: ['kind/chore', 'source/maintenance', 'priority/high'] });
              }
            } else if (process.env.RESULT === 'success' && issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `Resolved by ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
