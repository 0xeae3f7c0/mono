name: Renovate

# Hourly version updates for Cargo, Go, Python (uv), OpenTofu and npm
# (config: renovate.json). Dependabot's schedule cannot run more often than
# daily, so these ecosystems moved here; Dependabot keeps GitHub Actions,
# Docker, the dev container and security updates.
#
# Uses OWNER_TOKEN so Renovate's pull requests start CI and the Auto Merge
# workflow (pull requests opened with the default GITHUB_TOKEN do not).

on:
  # GitHub runs scheduled workflows best effort and drops many runs at the top
  # of the hour, so the schedule sits at :13 and every push to main (each merged
  # update) also starts a run. The concurrency group keeps runs one at a time.
  schedule:
    - cron: "13 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ secrets.OWNER_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
