name: Branch Cleanup

# Deletes automation branches whose pull request has been merged or closed.

on:
  schedule:
    - cron: "11 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be deleted
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const prefixes = ['automation/', 'activity/', 'deps/', 'dependabot/', 'renovate/'];
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            let deleted = 0;
            for (const { name, protected: isProtected } of branches) {
              if (isProtected || !prefixes.some(p => name.startsWith(p))) continue;
              const pulls = await github.rest.pulls.list({ owner, repo, head: `${owner}:${name}`, state: 'all', per_page: 1 });
              const pr = pulls.data[0];
              if (!pr || pr.state !== 'closed') continue;
              core.info(`${dryRun ? 'Would delete' : 'Deleting'} ${name} (PR #${pr.number})`);
              if (!dryRun) await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
              deleted++;
            }
            await core.summary.addRaw(`${dryRun ? 'Would delete' : 'Deleted'} ${deleted} branches.`).write();
