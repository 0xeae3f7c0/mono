name: CodeRabbit

# Asks CodeRabbit to review every pull request: comments "@coderabbitai full review"
# when a PR is opened, reopened or marked ready, and "@coderabbitai review" after
# each new push (an incremental review of the new commits). Draft PRs are skipped.
#
# The comment is posted with OWNER_TOKEN so it comes from the repository owner;
# CodeRabbit ignores commands from bot accounts. Dependabot-triggered runs cannot
# read repository secrets, so those fall back to GITHUB_TOKEN.
#
# pull_request_target runs in the base branch and never checks out PR code, so
# it is safe for pull requests from forks.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: coderabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    # CodeRabbit skips PRs authored by bots (Dependabot, github-actions) unless
    # the bot has a review seat, so asking for a review there only adds noise.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment @coderabbitai review
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          # A full review on open, an incremental one for new commits.
          if [[ "$ACTION" == "synchronize" ]]; then
            command="@coderabbitai review"
            # CodeRabbit answers "@coderabbitai review" with this note when it is
            # already reviewing new commits automatically; asking again only
            # repeats the note, so stop sending the command on this PR.
            note="is an incremental review system and does not re-review already reviewed commits"
            if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --jq '.[] | select(.user.login | startswith("coderabbitai")) | .body' \
              | grep -qF "$note"; then
              echo "CodeRabbit reviews new commits automatically on #$PR; not sending $command"
              exit 0
            fi
          else
            command="@coderabbitai full review"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$command"
