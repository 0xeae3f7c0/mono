name: Workflow Health

# Lints every workflow with actionlint, checks the latest run on main of each
# workflow, and checks the runs on the head commit of each open pull request.
# Opens one issue per lint finding, per workflow failing on main and per pull
# request with failing runs (labelled kind/ci, area/ci, source/workflow-health),
# and closes each issue once the finding is gone, a later run succeeds, or the
# pull request is merged or closed.
# See scripts/workflow-health.mjs.

on:
  # Hourly runs are best effort on GitHub; every push to main also starts one.
  schedule:
    - cron: "40 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workflow-health
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # On push, the other workflows for the same commit are still running, so
      # checking right away would only see the previous commit's results. Wait
      # (up to 60 minutes) until every other run on this commit has finished.
      - name: Wait for the other runs on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          deadline=$(( $(date +%s) + 60 * 60 ))
          while :; do
            pending=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\") | .name" | sort -u)
            if [ -z "$pending" ]; then
              echo "Every other run on $GITHUB_SHA has finished."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Still running after 60 minutes; checking anyway: $(echo "$pending" | paste -sd, -)"
              break
            fi
            echo "Waiting for: $(echo "$pending" | paste -sd, -)"
            sleep 60
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run actionlint
        # Exit code 1 only means findings; they become issues in the next step.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -format '{{json .}}' > "$RUNNER_TEMP/lint.json" || [ $? -eq 1 ]
      - run: node scripts/workflow-health.mjs --lint "$RUNNER_TEMP/lint.json"
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
