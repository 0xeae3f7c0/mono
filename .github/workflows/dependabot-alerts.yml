name: Dependabot Alerts to Issues

# Every 4 hours: one issue per open Dependabot security alert (labels kind/security,
# source/dependabot, app/<project>, priority by severity); issues close when their
# alert is fixed or dismissed. Reading alerts needs OWNER_TOKEN (classic PAT with
# repo scope, or fine-grained with "Dependabot alerts: read" and "Issues: write").

on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependabot-alerts
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: read
      issues: write
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/alerts-to-issues.mjs
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
