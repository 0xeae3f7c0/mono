name: Stale

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: priority/critical,priority/high,kind/security
          exempt-pr-labels: priority/critical,kind/security,deps/major
          stale-issue-message: "No activity for 30 days. This will close in 7 days unless updated."
          stale-pr-message: "No activity for 30 days. This will close in 7 days unless updated."
