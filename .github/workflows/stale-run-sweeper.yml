name: Stale Run Sweeper

# Every 4 hours, cancels queued workflow runs older than 6 hours whose commit is no longer the
# head of its branch (or whose branch was deleted). In-progress runs are left alone.

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be cancelled
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const cutoff = Date.now() - 6 * 60 * 60 * 1000;
            const heads = new Map();

            async function branchHead(branch) {
              if (!heads.has(branch)) {
                try {
                  const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
                  heads.set(branch, data.commit.sha);
                } catch (error) {
                  if (error.status !== 404) throw error;
                  heads.set(branch, null);
                }
              }
              return heads.get(branch);
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, status: 'queued', per_page: 100 });
            let cancelled = 0;

            for (const run of runs) {
              if (Date.parse(run.created_at) > cutoff) continue;
              const head = await branchHead(run.head_branch);
              if (head === run.head_sha) continue;
              core.info(`${dryRun ? 'Would cancel' : 'Cancelling'} ${run.name} #${run.run_number} (${run.html_url})`);
              if (!dryRun) await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              cancelled++;
            }

            await core.summary
              .addRaw(`${dryRun ? 'Would cancel' : 'Cancelled'} ${cancelled} of ${runs.length} queued runs.`)
              .write();
