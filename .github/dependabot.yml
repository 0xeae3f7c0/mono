# repository automation (.github/)
# Cargo, Go, Python (uv), OpenTofu and npm version updates come from Renovate
# (renovate.json, run hourly by .github/workflows/renovate.yml) and from
# scripts/update-deps.sh (maintenance.yml).
#
# Dependabot itself handles:
#   - version updates for GitHub Actions, Docker base images and the dev container;
#   - security updates for every ecosystem, which need no entry here.
#     Security updates need "Dependabot security updates" on in Settings.
# open-pull-requests-limit is 1000 per entry (default 5) so updates never queue up.
# Directory globs pick up new projects in pkgs/ without editing this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1000
    schedule:
      interval: daily
    labels: [kind/deps, area/ci, source/dependabot]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories: ["/pkgs/*/packages/*", "/pkgs/*"]
    open-pull-requests-limit: 1000
    schedule:
      interval: daily
    labels: [kind/deps, area/infra, source/dependabot]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: devcontainers
    directory: /
    open-pull-requests-limit: 1000
    schedule:
      interval: weekly
    labels: [kind/deps, area/infra, source/dependabot]
    commit-message:
      prefix: "build(deps)"

  # No version updates (Renovate owns Cargo); this entry exists only so security
  # updates skip glib in pkgs/desktop. Tauri 2's Linux webview is built on GTK 3
  # (gtk 0.18), which pins glib 0.18; the glib advisory is fixed only in 0.20, so
  # every security update attempt fails until Tauri moves off gtk-rs 0.18.
  - package-ecosystem: cargo
    directory: /pkgs/desktop
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    ignore:
      - dependency-name: glib
