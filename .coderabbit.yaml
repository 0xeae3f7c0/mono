# CodeRabbit AI code review (https://coderabbit.ai). Install the GitHub App
# (https://github.com/apps/coderabbitai) for this repository to enable it.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
    # Dependency bumps and release PRs are generated; CI covers them.
    ignore_title_keywords: ["(deps)", "/deps)", "chore(release)"]
  # Lockfiles and generated files are not worth reviewing line by line.
  path_filters:
    - "!**/Cargo.lock"
    - "!**/go.sum"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!flake.lock"
    - "!.github/labeler.yml"
    - "!.github/workflows/pkg-*.yml"
    - "!pkgs/portal/examples/entities.yaml"
  path_instructions:
    - path: "pkgs/**/default.nix"
      instructions: >-
        Nix packages: keep pinned version and hashes consistent; nix-update maintains them.
    - path: ".github/workflows/**"
      instructions: >-
        Check token permissions are minimal and that third-party actions are trusted.
    - path: "pkgs/webhooks/**"
      instructions: >-
        Webhook signature verification must stay constant-time and reject unsigned payloads.
chat:
  auto_reply: true
