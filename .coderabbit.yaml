# CodeRabbit AI code review (https://coderabbit.ai). Install the GitHub App
# (https://github.com/apps/coderabbitai) for this repository to enable it.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  # Reviews are requested by .github/workflows/coderabbit.yml, which comments
  # "@coderabbitai review" on every non-draft PR and each new push, so automatic
  # reviews are off to avoid reviewing twice.
  auto_review:
    enabled: false
    drafts: false
    base_branches: [main]
  # No "Review skipped" status comment on pull requests that only touch
  # filtered paths; .github/workflows/coderabbit.yml does not request a review
  # on those either.
  review_status: false
  # Lockfiles and generated files are not worth reviewing line by line.
  # .github/workflows/coderabbit.yml reads these patterns too.
  path_filters:
    - "!**/*.lock"
    - "!**/Cargo.lock"
    - "!**/go.sum"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!flake.lock"
    - "!.github/labeler.yml"
    - "!.github/workflows/pkg-*.yml"
    - "!pkgs/portal/examples/entities.yaml"
  path_instructions:
    - path: "pkgs/**/default.nix"
      instructions: >-
        Nix packages: keep pinned version and hashes consistent; nix-update maintains them.
    - path: ".github/workflows/**"
      instructions: >-
        Check token permissions are minimal and that third-party actions are trusted.
    - path: "pkgs/webhooks/**"
      instructions: >-
        Webhook signature verification must stay constant-time and reject unsigned payloads.
chat:
  auto_reply: true
