# commit monorepo
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["pkgs"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
walkdir = "2.5.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
serde_yaml_ng = "0.10.0"
regex = "1.13.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
insta = "1.49.0"
commit-core = { path = "crates/core" }
commit-git = { path = "crates/git" }
commit-report = { path = "crates/report" }

[profile.release]
lto = true
codegen-units = 1
strip = true
