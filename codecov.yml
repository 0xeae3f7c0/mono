# Codecov (https://about.codecov.io). Install the GitHub App
# (https://github.com/apps/codecov) for PR comments; uploads come from coverage.yml.
coverage:
  status:
    # Report coverage, but do not fail pull requests on small changes.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true

flags:
  rust:
    paths: ["crates/"]
    carryforward: true
  go:
    paths: ["go/", "pkgs/"]
    carryforward: true

ignore:
  - "**/*_test.go"
  - "crates/cli/tests/**"
