# minify: Minifies the widget bundle (commit platform, pkgs/minify)
[package]
name = "minify"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
swc_core = { version = "85.0.0", features = ["ecma_minifier", "ecma_parser", "ecma_codegen", "ecma_transforms", "common", "ecma_ast"] }

[workspace]
