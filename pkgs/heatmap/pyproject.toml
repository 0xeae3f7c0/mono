[project]
name = "heatmap"
version = "0.1.0"
description = "Commit activity heatmap: commits per weekday and hour from git history"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["rich>=14"]

[project.scripts]
commit-heatmap = "heatmap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
