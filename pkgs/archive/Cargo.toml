# archive: Uploads generated reports to S3 (commit platform, pkgs/archive)
[package]
name = "archive"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.3", features = ["behavior-version-latest"] }
# The default "rustls" feature pulls the legacy rustls 0.21 / rustls-webpki 0.101
# client, which has unpatched advisories; default-https-client (rustls 0.23) is kept.
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
clap = { version = "4.6.9", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
walkdir = "2.5.0"

[workspace]
